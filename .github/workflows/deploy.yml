name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Les builds redondants (commits rapprochés) s'annulent entre eux : seul le
    # plus récent produit l'artefact. Annuler un build est sans danger.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # IMPORTANT : on n'annule JAMAIS un déploiement en cours (cancel-in-progress:
    # false). Annuler un déploiement Pages en plein vol laisse le backend coincé
    # et fait patiner tous les déploiements suivants. Les déploiements
    # s'enchaînent donc proprement, un à la fois.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # (timeout par défaut = 600000 ms / 10 min, maximum autorisé par l'action)
