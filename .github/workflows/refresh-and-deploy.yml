name: Actualiser les données puis déployer

# Bouton unique : récupère les données SWARFARM, les committe si elles ont
# changé, puis rebuild et redéploie le site sur GitHub Pages — le tout en une
# seule exécution lançable manuellement depuis l'onglet Actions.

on:
  workflow_dispatch: {}
  schedule:
    # Filet de sécurité : tous les lundis à 6h00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: write   # committer public/data/monsters.json
  pages: write      # déployer sur Pages
  id-token: write   # OIDC requis par deploy-pages

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Une seule actualisation de données à la fois.
    concurrency:
      group: refresh-data
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les données SWARFARM
        run: node scripts/fetch-monsters.mjs

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data/monsters.json; then
            echo "Aucun changement, rien à committer."
          else
            git add public/data/monsters.json
            git commit -m "chore: actualisation automatique des données monstres"
            git push
          fi

  build:
    needs: update-data
    runs-on: ubuntu-latest
    # Même groupe que deploy.yml : builds redondants annulés (sans danger).
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - name: Checkout (dernier état de main, avec les données fraîches)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Même groupe que deploy.yml : les déploiements ne s'annulent jamais en
    # plein vol et s'enchaînent un à la fois (évite le backend Pages coincé).
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000 # 20 min : tolère un backend Pages lent sans échouer
