name: Tests

# La vérification complète d'une pull request vers `main` ou une branche de
# release : garde-fous de commit rejoués sur chaque commit, types, lint,
# suite complète (`npm test`), build. Sous Windows, le
# système sur lequel l'app se développe : les tests des hooks et de Git s'y
# comportent comme sur la machine de développement.
#
# Les tests qui lisent un export de compte réel (non suivi) se marquent
# « ignorés » sans lui : ils ne tournent qu'en local.

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch: {}

permissions:
  contents: read

# Un nouveau commit poussé sur la PR annule la vérification en cours.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historique complet : des tests lisent l'index et l'historique.
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Des tests créent des dépôts et des commits de travail.
      - name: Identité Git
        run: |
          git config --global user.name "CI SW Blacksmith"
          git config --global user.email "ci@swblacksmith.local"

      # `--no-verify` reste possible en local, pas ici : chaque commit de la PR
      # repasse par les hooks `commit-msg` et `pre-commit`.
      - name: Garde-fous de commit
        if: github.event_name == 'pull_request'
        run: node scripts/verifier-commits.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Dépendances
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      # Les avertissements s'affichent ; seule une erreur fait échouer.
      - name: Lint
        run: npm run lint

      - name: Suite complète
        run: npm test

      - name: Build
        run: npm run build
