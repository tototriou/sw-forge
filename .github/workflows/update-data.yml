name: Actualiser les données (SWARFARM)

# Récupère les données SWARFARM (côté CI, pas de navigateur => pas de CORS) et
# committe public/data/monsters.json s'il a changé. Le commit déclenche
# automatiquement un déploiement Vercel — pas besoin d'étape de déploiement ici.

on:
  workflow_dispatch: {}
  schedule:
    # Tous les lundis à 6h00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: write # committer public/data/monsters.json

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # ⚠️ Doit rester ALIGNÉ sur `engines` de package.json et sur `.nvmrc` :
          # développer sur une version et vérifier sur une autre laisse passer
          # des écarts d'API. C'est déjà arrivé (`navigator` en lecture seule
          # sous Node ≥ 22, corrigé après coup).
          node-version: 24

      - name: Récupérer les données SWARFARM
        run: node scripts/fetch-monsters.mjs

      # ⚠️ APRÈS les monstres : le script ne génère de fiche que pour les
      # monstres présents dans `monsters.json`. Lancé avant, il en manquerait
      # les nouveaux.
      - name: Récupérer le détail des compétences
        run: node scripts/fetch-skills.mjs

      # ⚠️ EN DERNIER : l'appariement des collaborations (Satoru Gojo = Werner)
      # a besoin des stats ET des compétences, donc des deux étapes ci-dessus.
      # Il réécrit `monsters.json` pour y poser le champ `jumeauCollab`.
      - name: Relier les monstres de collaboration
        run: node scripts/link-collabs.mjs

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data/ && [ -z "$(git status --porcelain public/data/)" ]; then
            echo "Aucun changement, rien à committer."
          else
            git add public/data/
            git commit -m "chore: actualisation automatique des données monstres et compétences"
            git push
          fi
