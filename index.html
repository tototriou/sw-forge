<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : sans lui, `env(safe-area-inset-*)` vaut ZÉRO et
         toutes les gardes posées sur l'encoche ou la barre de geste des iPhone
         sont inertes. La barre supérieure passait donc sous l'encoche, et son
         contenu y était mangé.

         maximum-scale=1 : empêche le ZOOM AUTOMATIQUE de Safari iOS à la mise
         au point d'un champ de saisie. C'est ici sa place, et non dans la
         taille du texte : la contrainte imposait 16 px à tous les champs, donc
         une barre de recherche qui écrivait plus gros que le menu déroulant
         posé à côté, ou bien un champ qui grandissait sous le doigt en
         s'activant. La taille du texte redevient une décision d'interface.
         ⚠️ Le zoom À DEUX DOIGTS reste possible : depuis iOS 10, Safari ignore
         cette restriction pour un geste de l'utilisateur, et ne l'applique
         qu'au zoom qu'il déclenche lui-même. Rien n'est retiré à qui a besoin
         d'agrandir — c'est ce qui rend cette valeur acceptable, là où un
         `user-scalable=no` ne le serait pas. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <title>SW Forge — Boîte à outils Summoners War</title>
    <meta name="description" content="Outil Summoners War : RTA, siège, arène — perfectionne ton compte simplement." />

    <!-- Open Graph (Discord, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SW Forge" />
    <meta property="og:title" content="SW Forge — Boîte à outils Summoners War" />
    <meta property="og:description" content="Outil Summoners War : RTA, siège, arène — perfectionne ton compte simplement." />
    <meta property="og:url" content="https://sw-forge.vercel.app/" />
    <meta property="og:image" content="https://sw-forge.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SW Forge — Boîte à outils Summoners War" />
    <meta name="twitter:description" content="Outil Summoners War : RTA, siège, arène — perfectionne ton compte simplement." />
    <meta name="twitter:image" content="https://sw-forge.vercel.app/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ⚠️ JetBrains Mono remplace Space Mono pour les CHIFFRES : efficiences,
         vitesses, ticks, compteurs. Space Mono a des chiffres larges et mous,
         illisibles en 11 px — or c'est la taille à laquelle on lit une
         efficience dans une liste de 60 tuiles. JetBrains Mono est dessinée
         pour le petit corps : hauteur d'x haute, zéro barré, 1 à empattement.
         Voir spec/shared/design.md. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Thème : posé AVANT la première peinture.
         ⚠️ Inline et synchrone, volontairement : chargé en module, le script
         s'exécuterait après le premier rendu et la page apparaîtrait dans le
         mauvais thème le temps d'un frame. En `auto` on ne pose RIEN — c'est la
         media query de index.css qui tranche. Voir spec/shared/design.md. -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem('sw-forge-theme-v1');
          if (c === 'light' || c === 'dark') document.documentElement.setAttribute('data-theme', c);
        } catch (e) {
          /* stockage indisponible : on suit le navigateur */
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-ink font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
