<title>aria-hidden n'exclut pas</title>
<style>
  body { margin: 8px; font: 14px sans-serif; }
  .bloc { margin: 8px 0; }
  .overflow-x-auto { overflow-x: auto; }
  .sm\:overflow-x-auto { overflow-x: auto; }
  .overflow-y-auto { overflow-y: auto; }
  .overflow-hidden { overflow: hidden; }
</style>
</head>
<body>
<!-- Signalé : aria-hidden cache aux lecteurs d'écran, pas à l'œil. -->
<div id="cache-aria" aria-hidden="true" data-attendu="geometrie" style="width: 600px; height: 20px; background: #ccc"></div>
</body>
