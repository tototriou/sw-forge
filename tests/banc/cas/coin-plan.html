<!doctype html>
<html lang="fr" data-attendu-page="non">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Icône en coin et plans</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  .avatar { position: relative; display: inline-flex; width: 40px; height: 40px; flex: none; }
  .image { display: block; width: 40px; height: 40px; background: #9cf; }
  .icone { position: absolute; top: -0.25rem; right: -0.25rem; width: 16px; height: 16px; background: #f90; }
  /* La barre de navigation basse du téléphone : fixe, au-dessus du contenu qui défile. */
  .barre { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; background: #333; }
  .barre button { flex: 1; height: 64px; border: 0; background: #555; }
  .entete { position: sticky; top: 0; display: flex; padding: 8px; background: #eee; }
</style>
</head>
<body>
<!-- Chevauchement : dans un en-tête collant, un texte voisin passe sous l'icône — même plan (l'en-tête). -->
<header id="entete" class="entete" data-attendu="">
  <span id="entete-avatar" class="avatar" data-attendu="">
    <span class="image"></span>
    <img id="entete-icone" class="icone" src="elements/fire.png" alt="" data-attendu="chevauchement" data-attendu-avec="entete-texte" data-attendu-aire="48">
  </span>
  <span id="entete-texte" data-attendu="">Nom du monstre</span>
</header>
<div style="height: 700px"></div>
<!-- Pas de chevauchement : l'avatar défile sous la barre fixe ; la barre est d'un autre plan. -->
<div style="padding: 8px">
  <span id="dessous-avatar" class="avatar" data-attendu="">
    <span class="image"></span>
    <img id="dessous-icone" class="icone" src="elements/water.png" alt="" data-attendu="">
  </span>
</div>
<nav id="barre" class="barre" data-attendu="">
  <button id="barre-bouton-1" data-attendu=""></button>
  <button id="barre-bouton-2" data-attendu=""></button>
</nav>
</body>
</html>
