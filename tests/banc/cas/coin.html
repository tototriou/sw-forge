<!doctype html>
<html lang="fr" data-attendu-page="non">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Icône en coin</title>
<style>
  body { margin: 8px; font: 14px sans-serif; }
  .bloc { margin: 16px 0; width: 200px; }
  /* Copie de MonsterAvatar : un avatar `relative`, son image, l'icône d'élément `absolute -top-1 -right-1` — un
     <img> dont la source se termine par /elements/<nom>.png (ElementIcon.tsx). L'image n'existe pas ici : seule
     sa boîte compte. */
  .avatar { position: relative; display: inline-flex; width: 40px; height: 40px; flex: none; }
  .image { display: block; width: 40px; height: 40px; background: #9cf; }
  .-top-1 { top: -0.25rem; }
  .-right-1 { right: -0.25rem; }
  .icone { position: absolute; width: 16px; height: 16px; background: #f90; }
</style>
</head>
<body>
<!-- Non signalés : l'avatar entouré de place ; l'icône le dépasse de 4 px, exactement son décalage, et couvre son
     image, qui est un descendant du bloc contenant. -->
<div id="place-parent" class="bloc" style="padding: 8px" data-attendu="">
  <span id="place-avatar" class="avatar" data-attendu="">
    <span id="place-image" class="image" data-attendu=""></span>
    <img id="place-icone" class="icone -top-1 -right-1" src="elements/fire.png" alt="" data-attendu="">
  </span>
</div>
<!-- Signalé (4 px) : le même avatar collé au bord droit de son parent ; le parent est au-delà du bloc contenant,
     rien ne lui est soustrait. -->
<div id="bord-parent" class="bloc" style="display: flex; justify-content: flex-end; padding-top: 8px" data-attendu="contenu" data-attendu-depassement="4">
  <span id="bord-avatar" class="avatar" data-attendu="">
    <span class="image"></span>
    <img id="bord-icone" class="icone -top-1 -right-1" src="elements/fire.png" alt="" data-attendu="">
  </span>
</div>
<!-- Chevauchement : un texte voisin, collé à l'avatar et du même plan, passe sous l'icône (4 px × 12 px). Ni son
     parent (ancêtre de l'icône) ni l'image de l'avatar (descendant du bloc contenant) ne comptent. -->
<div id="voisin-parent" class="bloc" style="display: flex; padding: 8px" data-attendu="">
  <span id="voisin-avatar" class="avatar" data-attendu="">
    <span class="image"></span>
    <img id="voisin-icone" class="icone -top-1 -right-1" src="elements/water.png" alt="" data-attendu="chevauchement" data-attendu-avec="voisin-texte">
  </span>
  <span id="voisin-texte" data-attendu="">Nom du monstre</span>
</div>
<!-- Signalé (3 px) : l'icône dépasse son décalage de 3 px (`transform`), l'avatar en retient 3. -->
<div class="bloc" style="padding: 8px">
  <span id="decale-avatar" class="avatar" data-attendu="contenu" data-attendu-depassement="3">
    <span class="image"></span>
    <img id="decale-icone" class="icone -top-1 -right-1" src="elements/wind.png" alt="" style="transform: translateX(3px)" data-attendu="">
  </span>
</div>
<!-- Signalé (6 px) : `right` vaut `auto` (`left: 0` et une largeur trop grande) ; sa valeur utilisée est négative,
     mais aucun décalage n'est déclaré : rien ne se soustrait, et pas de chevauchement à vérifier. -->
<div class="bloc" style="padding: 8px">
  <span id="auto-avatar" class="avatar" data-attendu="contenu" data-attendu-depassement="6">
    <span class="image"></span>
    <img id="auto-icone" class="icone" src="elements/light.png" alt="" style="top: 0; left: 0; width: 46px" data-attendu="">
  </span>
</div>
<!-- Non signalé : `left: 0` et `right: -0.25rem`, largeur `auto` ; l'icône s'étire de 4 px au-delà de l'avatar,
     exactement son décalage. -->
<div class="bloc" style="padding: 8px">
  <span id="etire-avatar" class="avatar" data-attendu="">
    <span class="image"></span>
    <img id="etire-icone" class="icone -top-1" src="elements/dark.png" alt="" style="left: 0; right: -0.25rem; width: auto" data-attendu="">
  </span>
</div>
<!-- Signalé (10 px) : `left`, `right` et `width` déclarés ; le navigateur ignore `right`, l'icône dépasse de 10 px
     par sa position et sa largeur, rien ne vient du décalage. -->
<div class="bloc" style="padding: 8px">
  <span id="surcontraint-avatar" class="avatar" data-attendu="contenu" data-attendu-depassement="10">
    <span class="image"></span>
    <img id="surcontraint-icone" class="icone -top-1" src="elements/fire.png" alt="" style="left: 30px; right: -0.25rem; width: 20px" data-attendu="">
  </span>
</div>
<!-- Signalé (4 px) : un bloc qui porte sa propre icône ET un avatar collé à son bord droit ; on lui soustrait sa
     propre icône, pas celle de l'avatar (dont il est un ancêtre au-delà du bloc contenant). -->
<div class="bloc" style="padding: 8px">
  <span id="mele-bloc" style="position: relative; display: flex; justify-content: flex-end; align-items: flex-start; width: 100px; height: 80px; padding-top: 8px; box-sizing: border-box; background: #eee" data-attendu="contenu" data-attendu-depassement="4">
    <span id="mele-avatar" class="avatar" data-attendu="">
      <span class="image"></span>
      <img id="mele-icone-avatar" class="icone -top-1 -right-1" src="elements/fire.png" alt="" data-attendu="">
    </span>
    <img id="mele-icone-bloc" class="icone" src="elements/water.png" alt="" style="bottom: -0.25rem; right: -0.25rem" data-attendu="">
  </span>
</div>
<!-- Signalé (4 px), comme au lot 4 : un <img> absolu au même décalage, dont la source n'est pas une icône
     d'élément. D11 ne vaut que pour l'icône d'élément. -->
<div class="bloc" style="padding: 8px">
  <span id="autre-img-avatar" class="avatar" data-attendu="contenu" data-attendu-depassement="4">
    <span class="image"></span>
    <img id="autre-img" class="icone -top-1 -right-1" src="images/badge.png" alt="" data-attendu="">
  </span>
</div>
<!-- Signalé (4 px), comme au lot 4 : un élément absolu au même décalage qui n'est pas un <img> (bouton, pastille…). -->
<div class="bloc" style="padding: 8px">
  <span id="pastille-avatar" class="avatar" data-attendu="contenu" data-attendu-depassement="4">
    <span class="image"></span>
    <span id="pastille" class="icone -top-1 -right-1" data-attendu=""></span>
  </span>
</div>
<!-- Signalé (4 px) : l'avatar coupe (`overflow: hidden`) et rogne l'icône — un vrai défaut, rien ne se soustrait. -->
<div class="bloc" style="padding: 8px">
  <span id="rogne-avatar" class="avatar" style="overflow: hidden" data-attendu="contenu" data-attendu-depassement="4">
    <span class="image"></span>
    <img id="rogne-icone" class="icone -top-1 -right-1" src="elements/fire.png" alt="" data-attendu="">
  </span>
</div>
</body>
</html>
