<!doctype html>
<html lang="fr" data-attendu-page="non">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Décoratif et ses descendants</title>
<style>
  body { margin: 8px; font: 14px sans-serif; }
  .carte { position: relative; width: 150px; height: 40px; margin: 8px 0; overflow: hidden; background: #eee; }
  .deco { position: absolute; left: 0; top: 0; width: 100px; height: 40px; background: #9cf; }
  .large { width: 180px; height: 20px; background: #ccc; }
</style>
</head>
<body>
<!-- Cas de relecture : le décoratif tient dans la carte, mais il porte un descendant CLIQUABLE
     (`pointer-events: auto`) de 180 px, qui dépasse la carte de 30 px. Retirer le décoratif le retirerait aussi : la
     carte reste signalée. -->
<div id="carte-cliquable-dedans" class="carte" data-attendu="contenu" data-attendu-depassement="30">
  <div id="deco-parent" class="deco" aria-hidden="true" style="pointer-events: none" data-attendu="">
    <div id="descendant-cliquable" class="large" style="pointer-events: auto" data-attendu=""></div>
  </div>
</div>
<!-- Non signalée : le même décoratif, dont le descendant n'est pas cliquable (`pointer-events: none` hérité) ; le
     sous-arbre entier est décoratif (aria-hidden vaut pour le sous-arbre). -->
<div id="carte-deco-dedans" class="carte" data-attendu="">
  <div class="deco" aria-hidden="true" style="pointer-events: none">
    <div id="descendant-deco" class="large" data-attendu=""></div>
  </div>
</div>
</body>
</html>
