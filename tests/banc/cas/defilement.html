<!doctype html>
<html lang="fr" data-attendu-page="oui">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Défilement voulu</title>
<style>
  body { margin: 8px; font: 14px sans-serif; }
  .bloc { margin: 8px 0; }
  .overflow-x-auto { overflow-x: auto; }
  .sm\:overflow-x-auto { overflow-x: auto; }
  .overflow-y-auto { overflow-y: auto; }
  .overflow-hidden { overflow: hidden; }
</style>
</head>
<body>
<!-- Non signalé : défilement déclaré (classe overflow-x-auto, overflow-x calculé auto). -->
<div id="defile" class="bloc overflow-x-auto" data-attendu="" style="width: 300px">
  <div id="defile-enfant" data-attendu="" style="width: 600px; height: 20px; background: #ccc"></div>
</div>
<!-- Non signalé : variante à préfixe. -->
<div id="defile-prefixe" class="bloc sm:overflow-x-auto" data-attendu="" style="width: 300px">
  <div id="defile-prefixe-enfant" data-attendu="" style="width: 600px; height: 20px; background: #ccc"></div>
</div>
<!-- Signalé : overflow-y-auto seul — overflow-x calculé auto, mais aucun défilement horizontal déclaré. -->
<div id="defile-y" class="bloc overflow-y-auto" data-attendu="contenu" style="width: 300px">
  <div id="defile-y-enfant" data-attendu="geometrie" style="width: 600px; height: 20px; background: #ccc"></div>
</div>
<!-- Signalé : la classe sans le calcul (overflow-x forcé à visible) n'est pas un défilement. -->
<div id="classe-seule" class="bloc overflow-x-auto" data-attendu="contenu" style="width: 300px; overflow-x: visible">
  <div id="classe-seule-enfant" data-attendu="geometrie" style="width: 600px; height: 20px; background: #ccc"></div>
</div>
</body>
</html>
