<!doctype html>
<html lang="fr" data-attendu-page="non">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Exclusion ellipsis</title>
<style>
  body { margin: 8px; font: 14px sans-serif; }
  .bloc { margin: 8px 0; }
  .overflow-x-auto { overflow-x: auto; }
  .sm\:overflow-x-auto { overflow-x: auto; }
  .overflow-y-auto { overflow-y: auto; }
  .overflow-hidden { overflow: hidden; }
</style>
</head>
<body>
<!-- Non signalé : texte coupé par ellipsis (overflow hidden + text-overflow ellipsis). -->
<div id="ellipsis" class="bloc" data-attendu="" style="width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Un libellé bien trop long pour sa case</div>
<!-- Signalé : texte coupé SANS ellipsis. -->
<div id="coupe-sans-ellipsis" class="bloc" data-attendu="contenu" style="width: 100px; overflow: hidden; white-space: nowrap">Un libellé bien trop long pour sa case</div>
<!-- Signalé : ellipsis demandée mais overflow visible — rien n'est coupé, le texte dépasse. -->
<div id="ellipsis-visible" class="bloc" data-attendu="contenu" style="width: 100px; text-overflow: ellipsis; white-space: nowrap">Un libellé trop long</div>
</body>
</html>
