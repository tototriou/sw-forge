<!doctype html>
<html lang="fr" data-attendu-page="non">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Espacement final</title>
<style>
  body { margin: 8px; font: 10px "Courier New", monospace; }
  .bloc { margin: 16px 0; display: flex; gap: 10px; padding: 8px; width: 300px; }
  /* Copie d'ArtifactsSummary : un libellé de largeur fixe (`w-[52px] flex-none text-right label`). Chasse fixe de
     6 px par lettre à 10 px et espacement de 10 px : « ABCD » avance de 4 × 16 = 64 px, dont 10 après la dernière
     lettre, où rien n'est dessiné ; le dessin fait 54 px. */
  .libelle { flex: none; text-align: right; letter-spacing: 10px; background: #eee; }
  .icone { display: inline-block; width: 8px; height: 8px; background: #f90; }
</style>
</head>
<body>
<!-- Non signalé : 54 px dessinés dans 56 px ; seuls les 10 px d'espacement final dépassent. -->
<div id="tient-parent" class="bloc" data-attendu="">
  <span id="tient" class="libelle" style="width: 56px" data-attendu="">ABCD</span>
</div>
<!-- Signalé (4 px) : 54 px dessinés dans 50 px ; l'espacement final retiré, 4 px dépassent encore. -->
<div id="deborde-parent" class="bloc" data-attendu="">
  <span id="deborde" class="libelle" style="width: 50px" data-attendu="contenu" data-attendu-depassement="4">ABCD</span>
</div>
<!-- Signalé (6 px) : le texte n'est pas le seul contenu — une icône de 8 px le suit sur la ligne, à 10 px
     d'espacement de sa dernière lettre (3 × 16 + 8 = 56 px dans 50) ; rien ne se retire. -->
<div class="bloc">
  <span id="suivi" class="libelle" style="width: 50px; white-space: nowrap"data-attendu="contenu" data-attendu-depassement="6">ABC<i class="icone"></i></span>
</div>
<!-- Signalé (4 px) : un libellé de largeur automatique (64 px, espacement final compris) pousse une boîte de 40 px
     hors d'une rangée de 100 px. Cet espacement place réellement la boîte : son retrait déplacerait la boîte, il
     n'est pas exact, rien ne se retire. -->
<div class="bloc">
  <div id="pousse-rangee" style="display: flex; width: 100px; flex: none" data-attendu="contenu" data-attendu-depassement="4"><span id="pousse-libelle" class="libelle" data-attendu="">ABCD</span><span style="flex: none; width: 40px; height: 8px; background: #f90"></span></div>
</div>
<!-- Signalé (10 px) : le libellé est `inline` dans un bloc de 54 px ; son texte n'a pas ses lignes à lui, rien ne se
     retire. -->
<div class="bloc">
  <div id="en-ligne-bloc" style="width: 54px; flex: none" data-attendu="contenu" data-attendu-depassement="10"><span class="libelle" style="display: inline">ABCD</span></div>
</div>
</body>
</html>
