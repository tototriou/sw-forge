<!doctype html>
<html lang="fr" data-attendu-page="non">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Pastilles et couronne</title>
<style>
  body { margin: 8px; font: 10px sans-serif; }
  .bloc { margin: 16px 0; width: 200px; padding: 8px; }
  /* Copie de MonsterAvatar (voir pastille-portrait.html). La couronne porte `data-pastille="couronne"`, mais
     n'est pas une pastille reconnue : hors du portrait, elle se mesure comme tout élément. */
  .portrait { position: relative; display: inline-flex; width: 50px; height: 50px; flex: none; }
  .petit { width: 24px; height: 24px; }
  .cadre { display: block; width: 100%; height: 100%; background: #9cf; }
  .lead { position: absolute; bottom: -0.375rem; left: -0.375rem; display: inline-flex; align-items: center; }
  .lead > img { flex: none; width: 22px; height: 22px; background: #c6f; }
  .couronne { position: absolute; top: -0.5rem; left: -0.25rem; width: 13px; height: 13px; background: #fd3; }
  .en-bas { top: auto; bottom: -0.5rem; }
  .a-droite { left: auto; right: -0.25rem; }
</style>
</head>
<body>
<!-- (c) Signalé : sur un portrait de 24 px, la couronne descendue en bas à gauche passe sous le badge « lead »
     (13 × 11 px). La couronne n'est pas une pastille : elle est « le reste » pour le badge, et n'est pas comparée
     elle-même. -->
<div class="bloc">
  <span id="c-portrait" class="portrait petit" data-portrait data-attendu="">
    <span class="cadre"></span>
    <span id="c-lead" data-pastille="lead" class="lead" data-attendu="chevauchement" data-attendu-avec="c-couronne" data-attendu-aire="143">
      <img src="leader/atk.png" alt="">
    </span>
    <span id="c-couronne" data-pastille="couronne" class="couronne en-bas" data-attendu=""></span>
  </span>
</div>
<!-- (c) Non signalé : sur un portrait de 50 px, la couronne à sa place (en haut à gauche) et le badge « lead » en bas
     à gauche ne se touchent pas. -->
<div class="bloc">
  <span id="c-loin-portrait" class="portrait" data-portrait data-attendu="">
    <span class="cadre"></span>
    <span id="c-loin-lead" data-pastille="lead" class="lead" data-attendu="">
      <img src="leader/atk.png" alt="">
    </span>
    <span id="c-loin-couronne" data-pastille="couronne" class="couronne" data-attendu=""></span>
  </span>
</div>
<!-- (h) Signalé (4 px) : une couronne qui dépasse le portrait à droite ; rien ne lui est soustrait. -->
<div class="bloc">
  <span id="h-portrait" class="portrait" data-portrait data-attendu="contenu" data-attendu-depassement="4">
    <span class="cadre"></span>
    <span id="h-couronne" data-pastille="couronne" class="couronne a-droite" data-attendu=""></span>
  </span>
</div>
<!-- (h) Non signalé : le même dépassement porté par une pastille reconnue (`element`) se soustrait. -->
<div class="bloc">
  <span id="h-pastille-portrait" class="portrait" data-portrait data-attendu="">
    <span class="cadre"></span>
    <span id="h-pastille" data-pastille="element" class="couronne a-droite" data-attendu=""></span>
  </span>
</div>
</body>
</html>
