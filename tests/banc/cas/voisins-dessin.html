<!doctype html>
<html lang="fr" data-attendu-page="non">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Voisins : couche qui ne dessine rien</title>
<style>
  body { margin: 8px; font: 14px sans-serif; }
  /* Deux frères dans la même case de grille (EtatMonstre.tsx : `col-start-1 row-start-1`) : le fond, puis la couche
     éprouvée, chacun 100 × 20 px, coupés en entier (2 000 px²). */
  .cellule { display: grid; grid-template-columns: 100px; margin: 12px 0; }
  .cellule > div { grid-area: 1 / 1; height: 20px; }
  .fond { background: #9cf; }
  .cellule p { margin: 0; }
  .cache { visibility: hidden; }
  .vu { visibility: visible; }
  /* La zone de toucher de src/index.css (même règle que zone-tactile.html). */
  .cible-tactile { position: relative; }
  .cible-tactile::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 44px;
    min-height: 44px;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
  }
  .puce::before { content: "•"; }
</style>
</head>
<body>
<!-- Exclusion (f), non signalés : la couche ne dessine rien. -->
<!-- Vide, fond transparent. -->
<div class="cellule">
  <div id="vide-fond" class="fond" data-attendu=""></div>
  <div id="vide-couche" style="background: rgba(0, 0, 0, 0)" data-attendu=""></div>
</div>
<!-- Le message de rappel d'EtatMonstre : son `p` est `invisible` (visibility: hidden). -->
<div class="cellule">
  <div id="invisible-fond" class="fond" data-attendu=""></div>
  <div id="invisible-couche" data-attendu=""><p class="cache">Rappel</p></div>
</div>
<!-- Les valeurs par défaut de Tailwind : ombre `0 0 #0000`, bord de 0 px, contour de 0 px ; texte de blancs seuls. -->
<div class="cellule">
  <div id="neutre-fond" class="fond" data-attendu=""></div>
  <div id="neutre-couche" style="box-shadow: 0 0 #0000, 0 0 #0000; border: 0 solid #888; outline: 0 solid #888" data-attendu="">   </div>
</div>
<!-- Une zone de toucher (`::after` au `content` vide, sans fond) ne dessine rien. -->
<div class="cellule">
  <div id="zone-fond" class="fond" data-attendu=""></div>
  <div id="zone-couche" class="cible-tactile" data-attendu=""></div>
</div>
<!-- Un enfant en `display: none` ne dessine rien, son fond compris. -->
<div class="cellule">
  <div id="aucun-fond" class="fond" data-attendu=""></div>
  <div id="aucun-couche" data-attendu=""><div style="display: none; height: 20px; background: #fc9"></div></div>
</div>

<!-- Signalés (voisins) : la couche dessine — par son texte, son bord, son ombre, son contour, une image de fond, un
     descendant rendu visible sous un parent invisible, un pseudo-élément, une image. -->
<div class="cellule">
  <div id="texte-fond" class="fond" data-attendu="voisins" data-attendu-avec="texte-couche" data-attendu-aire="2000"></div>
  <div id="texte-couche" data-attendu="">Rappel</div>
</div>
<div class="cellule">
  <div id="bord-fond" class="fond" data-attendu="voisins" data-attendu-avec="bord-couche" data-attendu-aire="2000"></div>
  <div id="bord-couche" style="box-sizing: border-box; border: 1px solid #888" data-attendu=""></div>
</div>
<div class="cellule">
  <div id="ombre-fond" class="fond" data-attendu="voisins" data-attendu-avec="ombre-couche" data-attendu-aire="2000"></div>
  <div id="ombre-couche" style="box-shadow: 0 0 #0000, 0 1px 2px rgba(0, 0, 0, 0.3)" data-attendu=""></div>
</div>
<div class="cellule">
  <div id="contour-fond" class="fond" data-attendu="voisins" data-attendu-avec="contour-couche" data-attendu-aire="2000"></div>
  <div id="contour-couche" style="outline: 1px solid #888; outline-offset: -1px" data-attendu=""></div>
</div>
<div class="cellule">
  <div id="degrade-fond" class="fond" data-attendu="voisins" data-attendu-avec="degrade-couche" data-attendu-aire="2000"></div>
  <div id="degrade-couche" style="background-image: linear-gradient(90deg, #fc9, transparent)" data-attendu=""></div>
</div>
<div class="cellule">
  <div id="visible-fond" class="fond" data-attendu="voisins" data-attendu-avec="visible-couche" data-attendu-aire="2000"></div>
  <div id="visible-couche" data-attendu=""><p class="cache"><span class="vu">Rappel</span></p></div>
</div>
<div class="cellule">
  <div id="pseudo-fond" class="fond" data-attendu="voisins" data-attendu-avec="pseudo-couche" data-attendu-aire="2000"></div>
  <div id="pseudo-couche" class="puce" data-attendu=""></div>
</div>
<div class="cellule">
  <div id="image-fond" class="fond" data-attendu="voisins" data-attendu-avec="image-couche" data-attendu-aire="2000"></div>
  <div id="image-couche" data-attendu=""><img src="portraits/a.png" alt="" style="display: block; width: 20px; height: 20px"></div>
</div>
</body>
</html>
