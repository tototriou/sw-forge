<!doctype html>
<html lang="fr" data-attendu-page="oui">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Zone de toucher au bord de la page</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  button { width: 20px; height: 20px; padding: 0; border: 0; background: #9cf; }
  .cible-tactile { position: relative; }
  .cible-tactile::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 44px;
    min-height: 44px;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
<!-- La zone de toucher sort de 12 px à droite de la fenêtre. Le bouton n'est pas signalé (sa zone de toucher ne compte pas) ;
     la page l'est : un `::after` qui l'élargit laisse un défilement latéral au téléphone. -->
<div style="display: flex; justify-content: flex-end">
  <button id="bouton-bord" class="cible-tactile" data-attendu=""></button>
</div>
</body>
</html>
